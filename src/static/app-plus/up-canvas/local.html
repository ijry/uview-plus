<!DOCTYPE html>
<html>
<head>
  <title></title>
  <style>
	  * {
		  margin: 0;
		  padding: 0;
	  }
  </style>
</head>
<body>
  <canvas id="qrcode"></canvas>
</body>
  <script type="text/javascript" src="./js/uni.webview.min.js"></script>
  <script type="text/javascript" src="./js/qrcode.min.js"></script>
  <script type="text/javascript">
	  document.addEventListener("UniAppJSBridgeReady", function() {
	  	// document.body.onclick = function() {
	  	// 	return uni.postMessage({
	  	// 		data: {
	  	// 			action: "onClick"
	  	// 		}
	  	// 	})
	  	// }
		uni.postMessage({
	  		data: {
	  			action: "onJSBridgeReady"
	  		}
	  	})
	  });
	  function isSafeUrl(url) {
		if (typeof url !== 'string') return false;
		var val = url.trim().toLowerCase();
		return val.indexOf('https://') === 0 || val.indexOf('http://') === 0 || val.indexOf('//') === 0 || val.indexOf('/') === 0 || val.indexOf('./') === 0 || val.indexOf('../') === 0 || val.indexOf('data:image/') === 0;
	  }
	  window.setContent = function(params) {
		QRCode.toCanvas(document.getElementById('qrcode'), params.val,
		  {
		    width: params.size,
		    height: params.size,
			margin: 0,
		    color: {
		      dark: params.foreground,
		      light: params.background
		    },
		    errorCorrectionLevel: 'H'
		  },
			function (error) {
				if (error) console.error(error)
				const canvas = document.getElementById('qrcode');
				const ctx = canvas.getContext('2d');
				// 2. 加载并绘制 logo
				if(params.icon && isSafeUrl(params.icon)) {
					const logo = new Image();
					logo.crossOrigin = "anonymous"; // 避免跨域问题（如适用）
					logo.onload = () => {
					  const logoSize = params.iconSize; // logo 宽高（建议不超过二维码宽高的 20%～25%）
					  const x = (canvas.width - logoSize) / 2;
					  const y = (canvas.height - logoSize) / 2;
					  ctx.drawImage(logo, x, y, logoSize, logoSize);
					};
					logo.src = params.icon;
				}
				console.log('success!');
			}
		)
		// var qrcode = new QRCode("qrcode", {
		//   text: params.val,
		//   width: params.size,
		//   height: params.size,
		//   colorDark : params.foreground,
		//   colorLight : params.background,
		//   correctLevel : QRCode.CorrectLevel.H
		// });
	  	uni.postMessage({
	  		data: {
	  			action: "qrcodeOk",
	  			imgData: ''
	  		}
	  	})
	  }
  </script>
</html>
